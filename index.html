
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h1 class="text-center text-primary">My To-Do App</h1>
            <p class="text-center">Welcome to my first Flask web app!</p>

            <form method="POST">
                <input type="text" name="task" class="form-control mb-3"
                       placeholder="Enter your task" required>
                <button type="submit" class="btn btn-primary w-100">
                    Add Task
                </button>
            </form>

            <h4 class="mt-4">My Tasks</h4>
            <ul class="list-group">
                {% for task in tasks %}
                    <li class="list-group-item">{{ task }}</li>
                {% else %}
                    <li class="list-group-item">No tasks added yet.</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
